name: Release Docker Image

# 触发方式:
#   1. 推送 git tag(格式 vX.Y.Z,如 v0.1.0)→ 自动构建并发版
#   2. 仓库 Actions 页面手动触发(workflow_dispatch)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # 发布目标:GitHub Container Registry,与仓库同名
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # 允许推送镜像到 ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 从 tag 生成镜像 tag:v0.1.0 → ghcr.io/chennest/model-downloader:v0.1.0 + latest
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 用 GitHub Actions 缓存加速重复构建
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 镜像发布成功后,自动创建 GitHub Release(打 tag 时触发)
  release:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许创建 Release

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 自动用当前 tag 作为 Release 版本
          # 自动生成 release notes(基于 tag 之间的 commit/PR)
          generate_release_notes: true
          name: model-downloader ${{ github.ref_name }}

